# HSIN Known Games List
# Empty by default - add games from the WebUI ("+ Add Game") instead of
# editing this by hand. Plain "package.name" boosts to "performance" when
# detected; "package.name:profile" boosts to that specific profile instead.
#
# Games NOT listed here still get a generic boost to "performance" if their
# package name contains "game" (case-insensitive) - this file is only for
# games that need a SPECIFIC profile or don't match that generic pattern.
