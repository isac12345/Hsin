# HSIN Configuration

# Profile saat ini: manual | battery | balanced | performance | extreme
# Instalasi BARU default = manual (mode manual murni: hanya knob yang
# di-set user yang ditulis; instalasi LAMA tidak diubah diam-diam —
# customize.sh hanya menyalin file ini bila belum ada).
PROFILE=manual

# Extreme tersedia langsung pada instalasi rooted.
# Vendor/kernel thermal protection tetap aktif; HSIN tidak menaikkan trip point.
ALLOW_EXTREME=false

# Mode thermal: DIHAPUS di v4.1.5 — thermal policy sekarang mengikuti
# profile aktif (battery/balanced/performance/extreme) secara otomatis
# lewat core/apply_engines.sh. Nilai lama (safe|performance|extreme)
# tidak lagi dipakai.
# THERMAL_MODE=performance

# Log level: 0=silent, 1=error, 2=warn, 3=info, 4=debug
LOG_LEVEL=3

# Monitor interval dalam detik (untuk monitor loop)
MONITOR_INTERVAL=15

# Per-app game mode (eksperimental, disabled default)
GAM_BOOST_ENABLED=false
# Contoh: com.mobile.legends:performance

# PATCH v4.0: charging-aware - otomatis switch ke profile battery pas
# nge-charge, balik lagi ke profil semula pas dicabut. Ringan (cek sysfs
# tiap MONITOR_INTERVAL), tidak ganggu game boost. Matikan dengan: false
CHARGE_AWARE=false

# Auto-rollback jika service crash (file .monitor.stop dicek)
AUTO_ROLLBACK_ON_CRASH=false

# Render backend: system (ikut default vendor) | skiagl | skiavk
# Diterapkan otomatis tiap boot lewat post-fs-data.sh, gak perlu apply manual lagi.
RENDERER=system

# Kunci refresh rate panel (peak = min) supaya gak loncat-loncat sendiri
# di antara mode adaptive (mis. 60/90/120Hz). Nilai otomatis dibulatkan
# ke mode terdekat yang didukung device.
REFRESH_LOCK_ENABLED=false
REFRESH_LOCK_HZ=120

# --- Global Refresh Rate Control (peak/min independen, beda dari lock di atas) ---
# NILAI DEFAULT DI SINI DIABAIKAN — otomatis diatur per profil aktif lewat
# profiles/*.conf (section [global_rr]). Isi manual di bawah ini HANYA
# dipakai kalau kamu ubah nilainya dari default (override paksa, lintas-profil).
GLOBAL_RR_ENABLED=false
GLOBAL_RR_REDUCED=false
GLOBAL_RR_FORCE=false
GLOBAL_RR_PEAK_HZ=120
GLOBAL_RR_MIN_HZ=60

# --- Advanced DVFS Limiter (persen dari freq max hardware, independen dari governor) ---
# Sama seperti di atas: default otomatis ikut profiles/*.conf [dvfs].
ADVANCED_DVFS_ENABLED=false
ADVANCED_DVFS_CPU_LIMIT=100
ADVANCED_DVFS_GPU_LIMIT=100

# --- Disable Frame Rate Limit (system-wide, beda dari refresh rate panel) ---
# Otomatis ikut profiles/*.conf [frame_limit].
FRAME_RATE_LIMIT_DISABLED=false

# --- SurfaceFlinger Tweak (scope aman: latch_unsignaled + gl_backpressure) ---
# Otomatis ikut profiles/*.conf [surfaceflinger].
SURFACEFLINGER_TWEAK_ENABLED=false
