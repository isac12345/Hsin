# HSIN Node Blacklist

# Kernel debug filesystem
/sys/kernel/debug/*
/sys/kernel/debug/tracing/*

# SELinux
/sys/fs/selinux/*
/sys/fs/selinux/enforce

# Random number generator
/proc/sys/kernel/random/*

# Kernel security
/proc/sys/kernel/kptr_restrict
/proc/sys/kernel/dmesg_restrict

# Module loading
/proc/sys/kernel/modules_disabled

# Kernel panic controls (DO NOT DISABLE -- system needs these for crash recovery)
/proc/sys/kernel/panic
/proc/sys/kernel/panic_on_oops
/proc/sys/kernel/panic_on_warn
/proc/sys/kernel/softlockup_panic

# Power management critical paths
/sys/power/state
/sys/power/mem_sleep

# IOMMU
/sys/kernel/iommu_groups/*

# Firmware
/lib/firmware/*
/vendor/firmware/*

# BPF filesystem (FAS-RS handles this)
/sys/fs/bpf/*
/sys/kernel/btf/*

# proc self
/proc/self/*
/proc/thread-self/*

# === HSIN Safety Blacklist ===

# Thermal disable (thermal MUST always remain active)
thermal_disable
thermal_off
battery_oc_protect_stop

# Watchdog disable (system stability risk)
watchdog_disable
watchdog_stop

# CPU hotplug disable (can cause system instability on some SoCs)
cpuhotplug/enabled

# SELinux mode change
enforce

# Kernel hardening
kexec_load_disabled
kexec_load
