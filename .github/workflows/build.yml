name: build
on:
  push:
    branches: [main, 'release/**']
  workflow_dispatch:
    inputs:
      draft_release:
        description: "Buat draft release dari hasil build ini (tidak pernah publish otomatis)"
        type: boolean
        default: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: SDK 34
        run: |
          if ! ls -d "$ANDROID_SDK_ROOT"/platforms/android-34 >/dev/null 2>&1; then
            SDKM=$(ls "$ANDROID_SDK_ROOT"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | head -1)
            if [ -n "$SDKM" ]; then
              yes | "$SDKM" --licenses >/dev/null 2>&1 || true
              "$SDKM" "platforms;android-34" "build-tools;34.0.0" || true
            fi
          fi

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Cek script modul
        run: |
          sudo apt-get install -y mksh >/dev/null
          command -v mksh >/dev/null || { echo "mksh tidak terpasang"; exit 1; }
          bash tools/check_module.sh

      - name: Selftest modul (dash, mirip shell HP)
        run: |
          sudo apt-get install -y dash >/dev/null 2>&1 || true
          for t in test_own test_adapt test_fpsd test_map; do
            dash tools/selftest/$t.sh > "/tmp/$t.log" 2>&1 || { tail -n 30 "/tmp/$t.log"; echo "GAGAL: $t"; exit 1; }
            tail -n 1 "/tmp/$t.log"
          done

      - name: Siapkan keystore dari Secrets (opsional)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/hsin.jks"
            echo "KEYSTORE_PATH=$RUNNER_TEMP/hsin.jks" >> "$GITHUB_ENV"
          else
            echo "Secret KEYSTORE_BASE64 kosong: APK ditandatangani debug key."
          fi

      - name: Uji unit APK
        run: gradle :app:testDebugUnitTest --no-daemon --console=plain

      - name: Build APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set +e
          gradle :app:assembleRelease --no-daemon --stacktrace > build.log 2>&1
          rc=$?
          grep -E "^e: |error:|What went wrong" -A2 build.log | head -60 | while IFS= read -r l; do echo "::error::${l}"; done
          exit $rc

      - name: Bangun daemon FPS native (NDK, tidak wajib)
        run: |
          NDK="${ANDROID_NDK_LATEST_HOME:-${ANDROID_NDK_HOME:-${ANDROID_NDK_ROOT:-}}}"
          if [ -z "$NDK" ] || [ ! -d "$NDK" ]; then echo "::warning::NDK tidak ditemukan, daemon FPS dilewati (modul tetap jalan tanpanya)"; exit 0; fi
          BIN="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin"
          mkdir -p module/bin
          ok=0
          "$BIN/aarch64-linux-android29-clang" -Os -Wall -o module/bin/hsin-fpsd-arm64 native/hsin-fpsd.c -ldl && ok=$((ok+1)) || echo "::warning::build arm64 gagal"
          "$BIN/armv7a-linux-androideabi29-clang" -Os -Wall -o module/bin/hsin-fpsd-arm32 native/hsin-fpsd.c -ldl && ok=$((ok+1)) || echo "::warning::build arm32 gagal"
          "$BIN/llvm-strip" module/bin/hsin-fpsd-* 2>/dev/null || true
          ls -la module/bin
          echo "daemon FPS terbangun: $ok dari 2"

      - name: Kemas modul (APK ikut di companion/) dan apk
        run: |
          VER=$(tr -d '[:space:]' < version.txt)
          APK=app/build/outputs/apk/release/app-release.apk
          test -f "$APK"
          mkdir -p module/companion dist
          cp "$APK" module/companion/HSINBubble.apk
          cp "$APK" "dist/HSIN-v5.0.apk"
          (cd module && zip -r9 -q "../dist/HSIN-v5.0-module.zip" . -x '*.git*')
          ls -la dist

      - name: Periksa daemon FPS ada di modul
        env:
          DRAFT: ${{ github.event_name == 'workflow_dispatch' && inputs.draft_release }}
        run: |
          Z=$(ls dist/HSIN-v*-module.zip)
          miss=0
          for b in bin/hsin-fpsd-arm64 bin/hsin-fpsd-arm32; do
            unzip -l "$Z" | grep -q " $b\$" || { echo "::warning::$b tidak ada di $Z"; miss=1; }
          done
          # Draft rilis tanpa daemon FPS = FPS hilang diam-diam di HP pengguna: gagalkan.
          if [ "$miss" = 1 ] && [ "$DRAFT" = "true" ]; then echo "::error::modul rilis tanpa hsin-fpsd"; exit 1; fi
          [ "$miss" = 0 ] && echo "daemon FPS ada di modul"; exit 0

      - uses: actions/upload-artifact@v4
        with:
          name: HSIN-v5.0
          path: dist/*

  draft-release:
    needs: build
    if: github.event_name == 'workflow_dispatch' && inputs.draft_release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: HSIN-v5.0
          path: dist

      - name: Checksums
        run: |
          cd dist
          sha256sum ./* > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Draft release (tidak pernah publish otomatis)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v5.0"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
          else
            gh release create "$TAG" --draft --title "HSIN v5.0" \
              --notes-file RELEASE.md dist/*
          fi
          echo "Draft release siap ditinjau di tab Releases. Publish hanya manual."
