name: build-modul

# Build ZIP modul HSIN (dev + release) lewat build_release.sh.
# Manual saja - tidak ada build otomatis saat push.
on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'Mode build'
        required: true
        default: dev
        type: choice
        options: [dev, release, both]

permissions:
  contents: read

jobs:
  zip:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install zip + shellcheck
        run: sudo apt-get update -qq && sudo apt-get install -y -qq zip shellcheck

      - name: Build ZIP modul
        run: sh build_release.sh ${{ inputs.mode }}

      - name: Verifikasi isi ZIP
        run: |
          set -e
          ls -la build/*.zip
          for z in build/*.zip; do
            echo "--- $z"
            unzip -l "$z" | head -40
            # core/runtime.sh harus ada dan berisi fungsi cache-scan
            unzip -p "$z" core/runtime.sh | grep -c 'hsin_scan_cache_load\|hsin_uk_set' || {
              echo "FATAL: runtime.sh tidak punya cache-scan/override"; exit 1; }
          done

      - name: Gate integritas runtime hasil merge (wajib)
        run: |
          set -e
          # Memakai file build_release.sh yang sama persis dengan yang
          # menghasilkan ZIP di step sebelumnya - bukanmerge ulang
          # terpisah, supaya yang diuji benar-benar yang dipaketkan.
          sh tests/verify_bundle_runtime.sh build/*.zip

      - name: Upload ZIP
        uses: actions/upload-artifact@v4
        with:
          name: hsin-modul-${{ inputs.mode }}
          path: build/*.zip
          if-no-files-found: error

      - name: Ringkasan
        run: |
          {
            echo "### ZIP Output"
            ls -la build/*.zip
          } >> "$GITHUB_STEP_SUMMARY"
