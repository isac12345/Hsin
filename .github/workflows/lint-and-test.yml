name: lint-and-test

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck

      - name: ShellCheck all .sh (except build/, errors only)
        run: |
          set -e
          find . -type f -name '*.sh' | grep -v '^./build/' | while read -r f; do
            echo "--- shellcheck $f ---"
            shellcheck -S error "$f" || { echo "FAIL: $f"; exit 1; }
          done

      - name: sh -n syntax validation
        run: |
          set -e
          find . -type f -name '*.sh' | grep -v '^./build/' | while read -r f; do
            echo "--- sh -n $f ---"
            sh -n "$f" || { echo "FAIL: sh -n $f"; exit 1; }
          done

      - name: Bundle merge integrity (runtime.sh hasil merge)
        run: |
          set -e
          # Gate anti kelas bug "merge diam-diam rusak": insiden
          # 2026-09-30 - statement top-level `return`/`exit` dan guard
          # `command -v X || \` dari file yang di-source LOLOS ke
          # runtime.sh gabungan, sehingga sourcing terpotong dan
          # hsin_apply_all_engines (jalur apply) tidak pernah
          # terdefinisi. Semua test lama tetap hijau karena menyource
          # file per-file dari source tree, bukan hasil merge.
          sh tests/verify_bundle_runtime.sh --merge-only

      - name: JSON config validation
        run: |
          set -e
          for f in capability/*.json config/*.json; do
            [ -f "$f" ] || continue
            echo "--- python3 -m json.tool $f ---"
            python3 -m json.tool "$f" > /dev/null || { echo "FAIL JSON: $f"; exit 1; }
          done
          echo "No JSON config files to validate (skipped safely)."

      - name: Mandatory file checks
        run: |
          set -e
          for f in action.sh service.sh post-fs-data.sh customize.sh uninstall.sh module.prop build_release.sh bin/hsin; do
            [ -f "$f" ] || { echo "FAIL: mandatory file missing: $f"; exit 1; }
            echo "OK: $f present"
          done

      - name: module.prop validation
        run: |
          set -e
          [ -f module.prop ] || { echo "FAIL: module.prop missing"; exit 1; }
          grep -q '^id=' module.prop || { echo "FAIL: module.prop missing id"; exit 1; }
          grep -q '^version=' module.prop || { echo "FAIL: module.prop missing version"; exit 1; }
          grep -q '^versionCode=' module.prop || { echo "FAIL: module.prop missing versionCode"; exit 1; }
          echo "OK: module.prop valid (id/version/versionCode present)"
