name: build-apk

# Build APK HSIN. Satu-satunya cara build: Termux tidak punya JDK/Android SDK.
# Sengaja manual (workflow_dispatch) - tidak ada yang dibangun otomatis saat
# push, sesuai perintah user "jangan build dulu".
on:
  workflow_dispatch:
    inputs:
      variant:
        description: 'Variant yang dibangun'
        required: true
        default: debug
        type: choice
        options: [debug, release]

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # CATATAN: android-actions/setup-android@v3 GAGAL di runner ubuntu-latest
      # sekarang - ia menjalankan `sdkmanager tools` dan paket "tools" sudah
      # dihapus di cmdline-tools terbaru ("Failed to find package 'tools'").
      # Runner sudah punya SDK + ANDROID_HOME, jadi kita pakai itu langsung
      # dan pasang paket yang memangNeeded secara eksplisit.
      - name: Setup Android SDK
        run: |
          # sdkmanager tidak ada di PATH default runner; ada di cmdline-tools.
          for _d in "$ANDROID_HOME"/cmdline-tools/*/bin; do
            [ -d "$_d" ] && echo "$_d" >> "$GITHUB_PATH"
          done
          echo "ANDROID_HOME=$ANDROID_HOME"
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Setup Gradle 8.7
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: Build APK
        working-directory: app
        run: gradle :app:assemble${{ inputs.variant == 'release' && 'Release' || 'Debug' }} --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: hsin-${{ inputs.variant }}-apk
          path: app/build/outputs/apk/*/*.apk
          if-no-files-found: error

      - name: Ringkasan
        run: |
          {
            echo "### APK Output"
            ls -la app/build/outputs/apk/*/*.apk || true
          } >> "$GITHUB_STEP_SUMMARY"
