# HSIN Profile: Performance

[profile]
name=performance
description=Performance optimized mode
priority=80

[cpu]
governor=schedutil
freq_max_percent=100
freq_min_percent=35
cpuset=performance
uclamp_min=15

[memory]
swappiness=60
vfs_cache_pressure=150
dirty_ratio=20
dirty_background_ratio=3

[gpu]
allow_dvfs=true
max_freq_percent=100
boost=true
mali_boost_level2=1
mali_pollingtime=3
mali_upthreshold=60

[io]
scheduler=mq-deadline
readahead_kb=2048

[network]
tcp_congestion=bbr
tcp_fastopen=3

[thermal]
mode=performance

[scheduler]
sched_child_runs_first=1

[global_rr]
enabled=true
reduced=false
force=false
peak_hz=120
min_hz=90

[dvfs]
enabled=false
cpu_limit=100
gpu_limit=100

[frame_limit]
disabled=true

[surfaceflinger]
enabled=true
