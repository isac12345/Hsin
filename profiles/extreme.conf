# HSIN Profile: Extreme

[profile]
name=extreme
description=Maximum performance. High risk. Requires ALLOW_EXTREME=true.
priority=70
risk=high
requires_opt_in=true

[extreme]
MODE=EXTREME
ALLOW_EXTREME=false

[cpu]
POLICY=MAX_ALLOWED
governor=performance
freq_min_percent=100
freq_max_percent=100

[gpu]
POLICY=MAX_ALLOWED
allow_dvfs=true
max_freq_percent=100
boost=true
mali_boost_level2=1
mali_pollingtime=1
mali_upthreshold=30

[thermal]
# Catatan: batas thermal extreme diatur engine (extreme/thermal_override.sh),
# bukan dari conf ini: emergency 95C, panic 100C, auto-restore pas panas.
# Key POLICY/trip_point/thermal_override sebelumnya ada tapi TIDAK pernah
# dibaca siapa-siapa (dead config) - sudah dibersihkan v4.1.

[memory]
ZRAM=KEEP
swappiness=10

[io]
MODE=PERFORMANCE
scheduler=mq-deadline
readahead_kb=4096

[network]
tcp_congestion=bbr
tcp_fastopen=3

[scheduler]
sched_child_runs_first=1

[global_rr]
enabled=true
reduced=false
force=true
peak_hz=120
min_hz=120

[dvfs]
enabled=false
cpu_limit=100
gpu_limit=100

[frame_limit]
disabled=true

[surfaceflinger]
enabled=true

[warning]
CRITICAL: This profile requests the hardware ceiling.
- Higher temperature/power draw are expected
- Kernel/OEM thermal protection is NOT disabled
- Thermal shutdown/throttling remains under vendor/kernel control
- Use only when you accept the extra heat and battery drain
