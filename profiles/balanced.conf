# HSIN Profile: Balanced

[profile]
name=balanced
description=Default balanced mode
priority=90

[cpu]
governor=schedutil
freq_max_percent=100
cpuset=default
uclamp_max=100

[memory]
swappiness=100
vfs_cache_pressure=100
dirty_ratio=30
dirty_background_ratio=5

[gpu]
allow_dvfs=true
max_freq_percent=100
boost=false
mali_boost_level2=0
mali_pollingtime=5
mali_upthreshold=80

[io]
scheduler=mq-deadline
readahead_kb=512

[network]
tcp_congestion=cubic
tcp_fastopen=1

[thermal]
mode=safe

[scheduler]
sched_child_runs_first=0

[global_rr]
enabled=false
reduced=false
force=false
peak_hz=90
min_hz=60

[dvfs]
enabled=false
cpu_limit=100
gpu_limit=100

[frame_limit]
disabled=false

[surfaceflinger]
enabled=false
