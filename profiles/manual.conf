# HSIN Profile: Manual (mode manual murni — hanya knob user yang diterapkan)
# Profil ini TIDAK menetapkan nilai tetap; semua penulisan dilewati kecuali
# override eksplisit dari user_knobs.env. Section minimal hanya untuk
# melewati validasi profile loader (hsin_profile_load). Tidak ada angka
# tuning palsu — semua nilai di bawah akan dilewati oleh logika manual.

[profile]
name=manual
description=Manual pure mode — apply only user overrides
priority=10

[cpu]
# Semua nilai CPU dilewati di manual kecuali override knob user.

[memory]
# Semua nilai memori dilewati di manual kecuali override knob user.

[gpu]
# Semua nilai GPU dilewati di manual kecuali override knob user.

[io]
# Semua nilai IO dilewati di manual kecuali override knob user.

[network]
# Semua nilai jaringan dilewati di manual kecuali override knob user.

[thermal]
# Thermal policy tetap berlaku (guard), tapi nilai tuning dilewati.

[scheduler]
# Dilewati di manual.

[global_rr]
# Dilewati di manual.

[dvfs]
# Dilewati di manual.

[frame_limit]
# Dilewati di manual.

[surfaceflinger]
# Dilewati di manual.
