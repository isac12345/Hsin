# HSIN Profile: Battery

[profile]
name=battery
description=Maximum battery savings
priority=100

[cpu]
governor=powersave
freq_max_percent=65
cpuset=default
uclamp_max=50

[memory]
swappiness=100
vfs_cache_pressure=50
dirty_ratio=40
dirty_background_ratio=10

[gpu]
allow_dvfs=true
max_freq_percent=80
boost=false
mali_boost_level2=0
mali_pollingtime=10
mali_upthreshold=95

[io]
scheduler=bfq
readahead_kb=128

[network]
tcp_congestion=cubic
tcp_fastopen=0

[thermal]
mode=safe

[scheduler]
sched_child_runs_first=0

[global_rr]
enabled=true
reduced=true
force=false
peak_hz=60
min_hz=60

[dvfs]
enabled=true
cpu_limit=65
gpu_limit=80

[frame_limit]
disabled=false

[surfaceflinger]
enabled=false
